# Strategy C (§4.2), LEWIS-lite arm: train on pseudo-parallel pairs
# synthesized by detector-guided mask-and-infill (biasneut.editor.lewis).
# The pure mask-and-infill arm needs no training at all — see
# biasneut.editor.mask_infill.MaskInfiller used directly at inference time.
strategy: c
backbone: t5-small
max_source_length: 128
max_target_length: 128
learning_rate: 3.0e-4
train_batch_size: 16
eval_batch_size: 32
num_epochs: 4
warmup_ratio: 0.06
use_constrained_decoding: true
copy_bias_strength: 2.5
num_beams: 4
output_dir: runs/editor_strategy_c_lewis
checkpoint_every_steps: 200
compute:
  mixed_precision: bf16
  gradient_checkpointing: true
  optimizer: adamw_8bit
  gradient_accumulation_steps: 1
  max_seq_length: 128
  seed: 42
